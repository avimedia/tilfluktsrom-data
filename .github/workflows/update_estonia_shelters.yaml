name: Update Estonia Shelters Data

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:      # Allows manual run

jobs:
  fetch_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyproj

      - name: Run Estonia shelter fetcher script
        run: |
          python fetch_estonia_shelters.py

      - name: Move estonia_shelters.json to docs (for GitHub Pages)
        run: |
          mkdir -p docs
          mv estonia_shelters.json docs/estonia_shelters.json

      - name: Commit and push changes
        run: |
          git config user.name "Shelter Bot"
          git config user.email "actions@github.com"
          git add docs/estonia_shelters.json
          git commit -m "Auto-update Estonia shelter data [skip ci]" || echo "No changes to commit"
          git push
