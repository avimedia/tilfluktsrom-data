
name: Update Lithuania Shelters Data

on:
  schedule:
    - cron: '0 4 1 * *'  # First day of each month at 04:00 UTC (data updates monthly)
  workflow_dispatch:  # Allows manual run

jobs:
  fetch_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pyogrio requests

      - name: Download and extract Lithuania .gdb file
        run: |
          echo "Downloading Lithuania shelter data..."
          wget -O PAGD_civiline_sauga.zip "https://www.geoportal.lt/download/opendata/PAGD/PAGD_civiline_sauga.zip"
          unzip -q PAGD_civiline_sauga.zip || echo "Unzip completed with warnings"
          echo "✓ Downloaded and extracted"
          ls -la

      - name: Create converter script
        run: |
          cat > convert_lithuania_gdb.py << 'EOFPYTHON'
          #!/usr/bin/env python3
          import geopandas as gpd
          import json
          from datetime import datetime
          import pandas as pd
          
          print("="*70)
          print("Lithuanian Shelter Data Converter")
          print("="*70)
          
          gdb_path = "PAGD_civiline_sauga.gdb"
          print(f"Reading {gdb_path}...")
          gdf = gpd.read_file(gdb_path, layer="Priedangos")
          print(f"Found {len(gdf)} shelters")
          
          gdf = gdf.to_crs("EPSG:4326")
          
          features = []
          for idx, row in gdf.iterrows():
              try:
                  lon, lat = row.geometry.x, row.geometry.y
                  
                  address_parts = []
                  if row.get('gatve') and not pd.isna(row['gatve']):
                      address_parts.append(str(row['gatve']))
                  if row.get('namo_numeris') and not pd.isna(row['namo_numeris']):
                      address_parts.append(str(row['namo_numeris']))
                  if row.get('gyvenviete') and not pd.isna(row['gyvenviete']):
                      address_parts.append(str(row['gyvenviete']))
                  if row.get('savivaldybe') and not pd.isna(row['savivaldybe']):
                      address_parts.append(str(row['savivaldybe']))
                  
                  address = ", ".join(address_parts) if address_parts else "Unknown address"
                  
                  capacity = 0
                  if row.get('gyventoju_skaicius') and not pd.isna(row['gyventoju_skaicius']):
                      capacity = int(row['gyventoju_skaicius'])
                  
                  date_str = datetime.now().strftime("%Y-%m-%d")
                  if row.get('atnaujinimo_data') and not pd.isna(row['atnaujinimo_data']):
                      date_str = row['atnaujinimo_data'].strftime("%Y-%m-%d")
                  
                  romnr = idx + 100000
                  
                  feature = {
                      "type": "Feature",
                      "geometry": {"type": "Point", "coordinates": [lon, lat]},
                      "properties": {
                          "romnr": romnr,
                          "plasser": capacity,
                          "adresse": address,
                          "adresse_avstand": None,
                          "datauttaksdato": date_str
                      }
                  }
                  features.append(feature)
              except Exception as e:
                  print(f"Error processing shelter {idx}: {e}")
          
          geojson = {
              "type": "FeatureCollection",
              "name": "Būstinės apsaugos prieglobos vietos (Lithuania)",
              "features": features
          }
          
          with open("lithuania_shelters.json", 'w', encoding='utf-8') as f:
              json.dump(geojson, f, ensure_ascii=False, indent=2)
          
          print(f"SUCCESS! Converted {len(features)} shelters")
          EOFPYTHON

      - name: Run Lithuania shelter converter
        run: |
          python convert_lithuania_gdb.py

      - name: Move lithuania_shelters.json to docs (for GitHub Pages)
        run: |
          mkdir -p docs
          mv lithuania_shelters.json docs/lithuania_shelters.json

      - name: Commit and push changes
        run: |
          git config user.name "Shelter Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update Lithuania shelter data [skip ci]"
          git pull --rebase origin main || true
          git push
