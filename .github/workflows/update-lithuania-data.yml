name: Update Lithuania Shelters Data

on:
  schedule:
    - cron: '30 3 * * 1'  # Every Monday at 03:30 UTC
  workflow_dispatch:      # Allows manual run

jobs:
  fetch_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Lithuania shelter fetcher script
        run: |
          python fetch_lithuania_shelters.py

      - name: Move lithuania_shelters.json to docs (for GitHub Pages)
        run: |
          mkdir -p docs
          mv lithuania_shelters.json docs/lithuania_shelters.json

      - name: Commit and push changes
        run: |
          git config user.name "Shelter Bot"
          git config user.email "actions@github.com"
          git add docs/lithuania_shelters.json
          git commit -m "Auto-update Lithuania shelter data [skip ci]" || echo "No changes to commit"
          git push
