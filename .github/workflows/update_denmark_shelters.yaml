name: Update Denmark Shelters Data

on:
  schedule:
    - cron:  '10 2 * * *'   # Every day at 02:10 UTC (change as desired)
  workflow_dispatch:        # Allows you to run manually as well

jobs:
  fetch_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Always good for pushing, especially on gh-pages

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run shelter fetcher script
        env:
          BBR_API_KEY: ${{ secrets.BBR_API_KEY }}
          DATAFORSYNINGEN_TOKEN: ${{ secrets.DATAFORSYNINGEN_TOKEN }}
        run: |
          python fetch_denmark_shelters_graphql.py

      - name: Move denmark_shelters.json to docs (for Github Pages)
        run: |
          mkdir -p docs
          mv denmark_shelters.json docs/denmark_shelters.json

      - name: Commit and push changes
        run: |
          git config user.name "Shelter Bot"
          git config user.email "actions@github.com"
          git add docs/denmark_shelters.json
          git commit -m "Auto-update Denmark shelter data [skip ci]" || echo "No changes to commit"
          git push
