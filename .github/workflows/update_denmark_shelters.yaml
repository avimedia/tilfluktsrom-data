name: Update Denmark Shelters Data

# Shelters come from Datafordeler: BBR v2 (buildings with shelter capacity) and
# DAR v2 (each building's official address). Needs the BBR_API_KEY secret, a
# Datafordeler API key with access to BBR and DAR. The fetcher refuses to write
# a file if any municipality fails or far fewer shelters than usual come back,
# so a broken run never replaces good data.

on:
  schedule:
    - cron: '10 2 * * 2'   # Tuesdays at 02:10 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_and_publish:
    runs-on: ubuntu-latest
    # A full run normally takes 1-2 hours, but Datafordeler is sometimes slow. Progress is
    # cached (below), so a run that hits this limit is resumed by the next one.
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the rebase before pushing can find a common ancestor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore progress from an unfinished run
        uses: actions/cache/restore@v4
        with:
          path: partial_denmark_shelters.json
          key: denmark-partial-${{ github.run_id }}
          restore-keys: denmark-partial-

      - name: Fetch Danish shelters
        env:
          BBR_API_KEY: ${{ secrets.BBR_API_KEY }}
          PYTHONUNBUFFERED: '1'   # show progress live, and keep it if the run is cancelled
          FETCH_DEADLINE_MINUTES: '320'   # stop cleanly before timeout-minutes (350)
        run: python fetch_denmark_shelters_graphql.py

      - name: Save progress for the next run
        if: always() && hashFiles('partial_denmark_shelters.json') != ''
        uses: actions/cache/save@v4
        with:
          path: partial_denmark_shelters.json
          key: denmark-partial-${{ github.run_id }}

      - name: Publish to docs/
        run: |
          mkdir -p docs
          mv denmark_shelters.json docs/denmark_shelters.json

      - name: Commit and push changes
        run: |
          git config user.name "Shelter Bot"
          git config user.email "actions@github.com"
          git add docs/denmark_shelters.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto-update Denmark shelter data [skip ci]"
          # Rebase onto and push to the branch this run is on (main for scheduled runs).
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
