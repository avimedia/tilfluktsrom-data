name: Update Denmark Shelters Data

# Shelters come from Datafordeler: BBR v2 (buildings with shelter capacity) and
# DAR v2 (each building's official address). Needs the BBR_API_KEY secret, a
# Datafordeler API key with access to BBR and DAR. The fetcher refuses to write
# a file if any municipality fails or far fewer shelters than usual come back,
# so a broken run never replaces good data.

on:
  schedule:
    - cron: '10 2 * * 2'   # Tuesdays at 02:10 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # a full run takes about 90 minutes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Danish shelters
        env:
          BBR_API_KEY: ${{ secrets.BBR_API_KEY }}
        run: python fetch_denmark_shelters_graphql.py

      - name: Publish to docs/
        run: |
          mkdir -p docs
          mv denmark_shelters.json docs/denmark_shelters.json

      - name: Commit and push changes
        run: |
          git config user.name "Shelter Bot"
          git config user.email "actions@github.com"
          git add docs/denmark_shelters.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto-update Denmark shelter data [skip ci]"
          git pull --rebase origin main
          git push
